{% load static %}<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Karakuri{% endblock %}</title><link rel="stylesheet" href="{% static 'app.css' %}"></head>
<body><header><a class="brand" href="{% url 'home' %}">Karakuri</a><nav>{% if user.is_authenticated %}<a href="{% url 'status' %}">利用状況</a>{% if user.is_staff %}<a href="{% url 'admin:index' %}">管理</a>{% endif %}<form method="post" action="{% url 'account_logout' %}">{% csrf_token %}<button class="quiet">ログアウト</button></form>{% endif %}</nav></header>
<main>{% for message in messages %}<p role="status">{{ message }}</p>{% endfor %}{% block content %}{% endblock %}</main><footer>日常の小さな不便に、ひとつずつ。</footer></body></html>
