{% extends 'base.html' %}{% block content %}<p class="eyebrow">YOUR APPS</p><h1>今日は、何をしよう。</h1><p class="lead">使いたいアプリを選んでください。</p><div class="grid">{% for app in apps %}<section class="card"><h2>{{ app.name }}</h2>{% if app.allowed %}<p>利用できます</p><a class="button" href="{% url 'app_entry' app.slug %}">アプリを開く</a>{% else %}<p class="notice">利用権限がありません。管理者にお問い合わせください。</p>{% endif %}</section>{% empty %}<p>アプリは準備中です。</p>{% endfor %}</div>{% endblock %}
